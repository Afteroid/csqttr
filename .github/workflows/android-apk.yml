name: Android APK from source

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK and native build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib cmake clang pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build all native ABIs including Gooby
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash rust-client/build_android_wsl.sh arm64-v8a armeabi-v7a x86_64
      - name: Test and build compact APKs
        run: >-
          bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
          -Pcsqtt.abis=arm64-v8a,armeabi-v7a,x86_64
          -Pcsqtt.compactApk=true
          -Pcsqtt.debugVersionNameSuffix=-debug.47
      - uses: actions/upload-artifact@v4
        with:
          name: CSQTTR-debug47-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
