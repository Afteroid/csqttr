name: Build CSQTT

on:
  push:
    branches: [ main, master, legasy, legacy ]
    tags: [ 'v*', '*legasy*', '*legacy*', '*2.5.0*' ]
  pull_request:
    branches: [ main, master, legasy, legacy ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build Linux Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
          components: rustfmt, clippy

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Build server binaries
        run: |
          chmod +x rust-server/build_linux.sh
          bash rust-server/build_linux.sh --no-tests

      - name: Prepare server artifacts
        run: |
          mkdir -p dist-server
          cp app/src/main/assets/csqtt-linux-amd64 dist-server/
          cp app/src/main/assets/csqtt-linux-arm64 dist-server/
          cp app/src/main/assets/csqtt-linux-armv7 dist-server/
          cp app/src/main/assets/csqtt.server-provenance.json dist-server/
          ls -lh dist-server/

      - name: Upload server assets
        uses: actions/upload-artifact@v4
        with:
          name: server-assets
          path: dist-server/
          if-no-files-found: error

  build-client:
    name: Build Android Client Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v4

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Build client native libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x rust-client/build_so.sh
          bash rust-client/build_so.sh --no-tests

      - name: Prepare client artifacts
        run: |
          mkdir -p dist-client
          cp -r app/src/main/jniLibs dist-client/
          cp app/src/main/libclient.provenance.json dist-client/
          ls -lh dist-client/

      - name: Upload client assets
        uses: actions/upload-artifact@v4
        with:
          name: client-assets
          path: dist-client/
          if-no-files-found: error

  build-apk:
    name: Build Android APK
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download server assets
        uses: actions/download-artifact@v4
        with:
          name: server-assets
          path: dist-server

      - name: Place server assets
        run: |
          mkdir -p app/src/main/assets
          cp -f dist-server/* app/src/main/assets/

      - name: Download client assets
        uses: actions/download-artifact@v4
        with:
          name: client-assets
          path: dist-client

      - name: Place client assets
        run: |
          mkdir -p app/src/main/jniLibs
          cp -rf dist-client/jniLibs/* app/src/main/jniLibs/
          cp -f dist-client/libclient.provenance.json app/src/main/libclient.provenance.json

      - name: Verify asset provenance
        run: |
          pwsh scripts/server_asset_provenance.ps1 -Mode Verify
          pwsh scripts/native_client_provenance.ps1 -Mode Verify

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore release.keystore -alias csqtt -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=csqtt, OU=csqtt, O=csqtt, L=csqtt, S=csqtt, C=US"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=csqtt" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build APKs with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"

      - name: Collect APK artifacts
        run: |
          mkdir -p release-apks
          APK_DIR="app/build/outputs/apk/release"
          [ -f "$APK_DIR/app-universal-release.apk" ] && cp "$APK_DIR/app-universal-release.apk" release-apks/CSQTT-universal.apk
          [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && cp "$APK_DIR/app-arm64-v8a-release.apk" release-apks/CSQTT-arm64-v8a.apk
          [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && cp "$APK_DIR/app-armeabi-v7a-release.apk" release-apks/CSQTT-armeabi-v7a.apk
          [ -f "$APK_DIR/app-x86_64-release.apk" ] && cp "$APK_DIR/app-x86_64-release.apk" release-apks/CSQTT-x86_64.apk
          ls -lh release-apks/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-apks
          path: release-apks/
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            release-apks/*.apk
            dist-server/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
