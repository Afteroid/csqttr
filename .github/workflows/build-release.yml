name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABIs, comma separated"
        required: true
        default: "arm64-v8a,armeabi-v7a,x86_64"
        type: string

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: "28.2.13676358"
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib cmake clang pkg-config ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Rust core
        env:
          ABIS_INPUT: ${{ inputs.abis }}
        run: |
          read -r -a ABIS <<< "$(printf '%s' "$ABIS_INPUT" | tr ',' ' ')"
          chmod +x rust-client/build_android_wsl.sh
          bash rust-client/build_android_wsl.sh "${ABIS[@]}"

      - name: Build signed release APK
        env:
          ABIS_INPUT: ${{ inputs.abis }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ABIS=$(printf '%s' "$ABIS_INPUT" | tr -d ' ')
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -Pcsqtt.abis="$ABIS"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: csqttr-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
