[package]
name = "csqtt-gooby"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Embedded Gooby runtime for CSQTTR"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
mlua = { version = "0.10", features = ["luajit", "vendored", "send"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tracing = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
