[package]
name = "csqttr-ios-core"
version = "2.5.2"
edition = "2024"
rust-version = "1.97.1"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["amurcanov"]
description = "CSQTTR iOS core library"

[lib]
name = "csqttr_ios_core"
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
arc-swap = "1.9.2"
aws-lc-rs = "=1.18.0"
base64 = "0.23.0"
bytes = "1.12.1"
clap = { version = "4.6.4", default-features = false, features = ["derive", "std", "usage", "error-context"] }
crossbeam-queue = "0.3.13"
ctr = "0.10.1"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
crc32fast = "1.5.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libc = "0.2.189"
md-5 = "0.11.0"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
rand = { version = "0.10.2", features = ["sys_rng"] }
regex = { package = "regex-lite", version = "0.1.9" }
primp = "1.3.1"
futures = "0.3"
netstack-smoltcp = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "io-std"] }
tokio-util = "0.7.19"
turn-rustls = { package = "primp-rustls", version = "=0.23.40", default-features = false, features = ["std", "tls12"] }
turn-tokio-rustls = { package = "primp-tokio-rustls", version = "=0.26.5" }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "=1.0.9"
getrandom = "0.4"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31.3", features = ["socket", "uio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.ios-release]
inherits = "release"
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
primp = { path = "../rust-client/vendor/primp" }
netstack-smoltcp = { path = "../rust-client/vendor/netstack-smoltcp" }
